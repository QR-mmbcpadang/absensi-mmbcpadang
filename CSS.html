<style>

:root{
  --primary:#0d6efd;
  --success:#16a34a;
  --warning:#f59e0b;
  --danger:#dc2626;
  --white:#ffffff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Poppins',sans-serif;

    background:linear-gradient(180deg,#22c1f1,#0d6efd);

    min-height:100vh;

}

.wrapper{

    max-width:500px;

    margin:30px auto;

    padding:15px;

}

.card{

    background:#fff;

    border-radius:25px;

    padding:25px;

    box-shadow:0 15px 40px rgba(0,0,0,.18);

}

.logo{

    width:110px;

    display:block;

    margin:auto;

}

.title{

    text-align:center;

    margin-top:15px;

    font-size:30px;

    font-weight:bold;

    color:#222;

}

.company{

    text-align:center;

    color:#666;

    font-size:18px;

    margin-bottom:20px;

}

.datetime{

    text-align:center;

    margin-bottom:20px;

}

#tanggal{

    font-size:17px;

}

#jam{

    font-size:34px;

    font-weight:bold;

    color:#0d6efd;

}

.status{

    border-radius:12px;

    padding:14px;

    text-align:center;

    font-size:18px;

    font-weight:bold;

    margin-bottom:20px;

}

.waiting{

    background:#fff8db;

    color:#b8860b;

}

.process{

    background:#dbeafe;

    color:#0d6efd;

}

.success{

    background:#d1fae5;

    color:#16a34a;

}

.error{

    background:#fee2e2;

    color:#dc2626;

}

.scan-box{

    border:3px dashed #0d6efd;

    border-radius:20px;

    padding:15px;

}

#reader{

    width:100%;

}

#hasil{

    margin-top:20px;

    text-align:center;

    font-size:20px;

    font-weight:bold;

}

.footer{

    text-align:center;

    margin-top:25px;

    color:#999;

    font-size:13px;

}
.success-box{

    background:#e8fff1;
    border:2px solid #27ae60;
    border-radius:15px;
    padding:20px;
    margin-top:20px;
    text-align:center;

}

.success-box h1{

    color:#27ae60;
    font-size:40px;

}

.success-box h2{

    color:#27ae60;

}

.success-box h3{

    margin-top:10px;

}

.error-box{

    background:#fff1f1;
    border:2px solid #e74c3c;
    border-radius:15px;
    padding:20px;
    margin-top:20px;
    text-align:center;

}

.error-box h2{

    color:#e74c3c;

}

.error-box h3{

    color:#555;

}
