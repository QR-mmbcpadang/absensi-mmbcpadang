<script>

let html5QrCode = null;
let scanning = false;

document.addEventListener("DOMContentLoaded", () => {
    startScanner();
});

//======================================
// START SCANNER
//======================================

async function startScanner(){

    if(scanning) return;

    scanning = true;

    document.getElementById("hasil").innerHTML = "";

    setStatus("warning","🟡 Menunggu Scan");

    try{

        html5QrCode = new Html5Qrcode("reader");

        const cameras = await Html5Qrcode.getCameras();

        if(cameras.length==0){

            setStatus("error","🔴 Kamera tidak ditemukan");
            return;

        }

        const cameraId = cameras[cameras.length-1].id;

        await html5QrCode.start(

            cameraId,

            {
                fps:10,
                qrbox:{width:250,height:250}
            },

            onScanSuccess,

            ()=>{}

        );

    }catch(e){

        console.log(e);

        setStatus("error","🔴 Tidak dapat membuka kamera");

    }

}


//======================================
// SAAT QR TERBACA
//======================================

function onScanSuccess(qr){

    if(!scanning) return;

    scanning=false;

    beep();

    setStatus("warning","🟡 Sedang memproses scan...");

    html5QrCode.stop().then(()=>{

        google.script.run
        .withSuccessHandler(showResult)
        .scanQR(qr);

    });

}


//======================================
// HASIL
//======================================

function showResult(res){

    let html="";

    if(res.status){

        html=`

        <div class="success-box">

            <h2>✅ ABSEN BERHASIL</h2>

            <h3>${res.nama}</h3>

            <h1>${res.statusAbsen}</h1>

        </div>

        `;

        setStatus("success","🟢 Berhasil");

    }else{

        html=`

        <div class="error-box">

            <h2>❌ ABSEN GAGAL</h2>

            <h3>${res.pesan}</h3>

        </div>

        `;

        setStatus("error","🔴 Gagal");

    }

    document.getElementById("hasil").innerHTML=html;

    // tampil 5 detik
    setTimeout(function(){

        document.getElementById("hasil").innerHTML="";

        startScanner();

    },5000);

}

</script>
