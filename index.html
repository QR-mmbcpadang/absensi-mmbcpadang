<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ABSENSI QR MMBC PADANG</title>

    <link rel="stylesheet" href="css.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1565ff">
</head>
    
<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
}
</script>
<body>

<div class="container">

    <img src="Logo.jpeg" class="logo" alt="Logo">

    <h1>ABSENSI QR</h1>

    <h2>MMBC PADANG</h2>

    <div id="tanggal" class="tanggal"></div>

    <div id="jam" class="jam"></div>

    <div id="status" class="status-box">
        🟡 Menunggu Scan
    </div>

    <div id="scannerArea">

        <div class="scan-box">

            <div id="reader"></div>

        </div>

    </div>

    <div id="hasil"></div>
    <div id="pilihanLokasi">

    <button id="btnKantor" class="btnLokasi">
        🏢 ABSEN KANTOR
    </button>

    <button id="btnLapangan" class="btnLokasi">
        🚗 ABSEN LAPANGAN
    </button>

</div>
<div id="selfieArea" style="display:none;">

    <video id="video" autoplay playsinline></video>

    <canvas id="canvas" style="display:none;"></canvas>

    <button id="btnSelfie">
        📸 Ambil Selfie
    </button>

</div>
    <div class="footer">

        © MMBC PADANG

    </div>

</div>

<!-- Library Scanner -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

<!-- Javascript -->
<script src="app.js"></script>

<!-- Scanner -->
<script src="scanner.js"></script>

</body>

</html>
